name: tmp-update-readme
on:
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: git checkout dev && git pull origin dev
      - run: python tmp_update_readme.py
      - name: Commit README
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f tmp_update_readme.py .github/workflows/tmp-update-readme.yml || true
          git add README.md
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'docs: update README TODO list'
          git push origin HEAD:dev
